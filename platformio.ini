; Whisli Bean - turns any IR remote into a smart home controller. ESP32-C3 Super Mini.
; PlatformIO has no such board; esp32-c3-devkitm-1 has the same chip (ESP32-C3, 4 MB flash).

[platformio]
default_envs = whisli-bean

[env:whisli-bean]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
; Two 1.9 MB app slots for OTA and 128 KB for the button database.
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
build_flags =
    -std=gnu++17
    ; The board only has native USB, so Serial goes over USB CDC.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
lib_deps =
    esp32async/AsyncTCP@3.5.0
    esp32async/ESPAsyncWebServer@3.12.1
    bblanchon/ArduinoJson@7.4.2
; Builds the panel (ui/) and the version header before compiling.
extra_scripts = pre:scripts/prebuild.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Over Wi-Fi: pio run -e ota -t upload --upload-port <ip>
; The panel password comes from the WHISLI_BEAN_PASSWORD environment variable.
[env:ota]
extends = env:whisli-bean
upload_protocol = custom
upload_command = curl --fail-with-body -sS -u whisli:${sysenv.WHISLI_BEAN_PASSWORD} -H "Content-Type: application/octet-stream" --data-binary @$SOURCE http://$UPLOAD_PORT/api/v1/firmware
